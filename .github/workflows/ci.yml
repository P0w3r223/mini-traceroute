name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux (full build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (portable core + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (core + tests only)
        run: cmake -B build -DMTR_BUILD_CLI=OFF
      - name: Build tests
        run: cmake --build build --config Release --target mtr_tests
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
